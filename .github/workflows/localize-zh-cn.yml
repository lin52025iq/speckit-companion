name: Localize zh-CN manifest

on:
  push:
    branches:
      - i18n/zh-cn-vscode-copy
    paths:
      - package.json
      - scripts/localize-package-zh-cn.mjs
      - scripts/add-build-vsix-script.mjs
      - scripts/set-fork-publisher.mjs
      - .github/workflows/localize-zh-cn.yml

permissions:
  contents: write

jobs:
  localize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: i18n/zh-cn-vscode-copy
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate Chinese manifest copy
        run: node scripts/localize-package-zh-cn.mjs
      - name: Add one-command VSIX build script
        run: node scripts/add-build-vsix-script.mjs
      - name: Set fork publisher
        run: node scripts/set-fork-publisher.mjs
      - name: Commit generated manifest
        run: |
          if git diff --quiet -- package.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "feat(i18n): refresh localized manifest and build scripts"
          git push
